name: KNAS website bouwen en publiceren

on:
  schedule:
    # Four refresh windows per day with a one-hour fallback; UTC keeps spacing stable across DST.
    - cron: '17 0,6,12,18 * * *'
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.singlefile.config.ts'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: knas-site
  cancel-in-progress: false

jobs:
  check-time:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            last_sync=$(node -p "require('./src/generated/knas-news.json').syncedAt || ''")
            now_epoch=$(date -u +%s)
            if [[ -n "$last_sync" ]]; then
              last_sync_epoch=$(date -u -d "$last_sync" +%s)
              sync_age=$((now_epoch - last_sync_epoch))
            else
              sync_age=2147483647
            fi

            if (( sync_age >= 18000 )); then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled refresh is due; last successful sync was ${sync_age}s ago."
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "A recent refresh already ran ${sync_age}s ago; skipping this fallback."
            fi
          elif [[ "$EVENT_NAME" == "push" && "$ACTOR" == "knas-nieuws-bot" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the bot's generated-data commit to avoid a duplicate deployment."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Syncscripts behouden bestaande data bij tijdelijke bronstoringen; strict faalt alleen zonder cache.
      - run: node scripts/sync-knas-news.mjs --strict

      - run: node scripts/sync-nahouw-calendar.mjs --strict

      - run: node scripts/sync-international-entries.mjs --strict

      - name: Gesynchroniseerde data bewaren in de repository
        run: |
          git config user.name "knas-nieuws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/generated/knas-news.json src/generated/nahouw-calendar.json src/generated/international-entries.json public/images/news public/docs/topsport/internationale-aanmeldingen-actueel.pdf
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Nieuws en wedstrijdkalender gesynchroniseerd"
            git push
          fi

      - run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
