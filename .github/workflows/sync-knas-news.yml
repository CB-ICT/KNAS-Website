name: KNAS website bouwen en publiceren

on:
  schedule:
    # GitHub Actions cron is UTC: 22:00 UTC is midnight in CEST; 23:00 UTC in CET.
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.singlefile.config.ts'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: knas-site
  cancel-in-progress: false

jobs:
  check-time:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            local_offset=$(TZ=Europe/Amsterdam date +%z)
            if [[ "$EVENT_SCHEDULE" == "0 22 * * *" && "$local_offset" == "+0200" ]] || \
               [[ "$EVENT_SCHEDULE" == "0 23 * * *" && "$local_offset" == "+0100" ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "This cron maps to Amsterdam midnight for the current DST offset; deployment will run even if GitHub queued the runner late."
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "This UTC cron does not match the Amsterdam DST offset; skipping to avoid a duplicate deployment."
            fi
          elif [[ "$EVENT_NAME" == "push" && "$ACTOR" == "knas-nieuws-bot" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the bot's generated-data commit to avoid a duplicate deployment."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Faalt hard als knas.nl onbereikbaar is, zodat er geen lege publicatie plaatsvindt.
      - run: node scripts/sync-knas-news.mjs --strict

      - run: node scripts/sync-nahouw-calendar.mjs --strict

      - run: node scripts/sync-international-entries.mjs --strict

      - name: Gesynchroniseerde data bewaren in de repository
        run: |
          git config user.name "knas-nieuws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/generated/knas-news.json src/generated/nahouw-calendar.json src/generated/international-entries.json public/images/news public/docs/topsport/internationale-aanmeldingen-actueel.pdf
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Nieuws en wedstrijdkalender gesynchroniseerd"
            git push
          fi

      - run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
